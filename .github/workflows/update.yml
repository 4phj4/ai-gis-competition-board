name: 更新 AI 与 GIS 竞赛看板

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competition-board-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect public announcements
        run: python collect.py
      - name: Persist history and page data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json dist/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh competition board'
            git push
          fi
      - name: Package public page when explicitly enabled
        if: vars.PUBLIC_SITE == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-public:
    if: vars.PUBLIC_SITE == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
